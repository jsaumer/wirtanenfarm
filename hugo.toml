baseURL = 'https://wirtanenfarm.org/'
locale = 'en-US'
title = 'Wirtanen Pioneer Farm'
# The pages are plain files in static/. Hugo only copies them into public/.
# 'home' stays enabled because Hugo crashes with it disabled; with no template
# it prints a "found no layout file" warning on each build, which is harmless.
disableKinds = ['page', 'section', 'taxonomy', 'term', 'rss', 'sitemap', '404']
